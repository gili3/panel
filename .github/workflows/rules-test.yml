name: اختبار قواعد Firebase (Firestore + Storage)

# يشغّل tests/rules على محاكي Firebase عند أي تعديل على القواعد أو اختباراتها، وكذلك
# يدوياً. فشل أي اختبار = القواعد فتحت ثغرة (أو كسرت مساراً شرعياً) — لا تنشرها.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/rules/**"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "tests/rules/**"
      - ".github/workflows/rules-test.yml"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # محاكي Firestore/Storage يحتاج Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --no-frozen-lockfile
      - name: اختبار القواعد
        run: pnpm test:rules
